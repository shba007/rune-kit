name: Rune Deploy

permissions:
  contents: write
  attestations: write
  id-token: write

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            archive_ext: 'tar.gz'

          # Statically linked — runs on any Linux distro regardless of glibc
          # version. Needs musl-tools, and native-dependency crates (e.g.
          # extism/wasmtime) occasionally need extra setup under musl; if this
          # job fails on linking, drop it and keep the gnu build above.
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-musl'
            archive_ext: 'tar.gz'
            musl: true

          - platform: 'macos-latest' # Apple Silicon
            target: 'aarch64-apple-darwin'
            archive_ext: 'tar.gz'

          - platform: 'macos-latest' # Intel
            target: 'x86_64-apple-darwin'
            archive_ext: 'tar.gz'

          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            archive_ext: 'zip'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 📦 Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: ⚙️ Build Release Binary
        run: cargo build --release -p rune-kit-cli --target ${{ matrix.target }}

      - name: 📦 Package Binary (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          tar czf rune-${{ env.VERSION }}-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release rune

      - name: 📦 Package Binary (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/rune.exe `
            -DestinationPath rune-${{ env.VERSION }}-${{ matrix.target }}.zip

      - name: 📝 Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'rune-${{ env.VERSION }}-${{ matrix.target }}.${{
            matrix.archive_ext }}'

      - name: ⬆️ Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: rune-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive_ext }}
