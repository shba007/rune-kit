name: Rust CI

permissions:
  contents: read

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: >
      !(
        contains(github.event.head_commit.message, 'ci(release):') ||
        contains(github.event.head_commit.message, '[skip ci]') ||
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        startsWith(github.event.head_commit.message, 'Merge branch')
      )
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      # 1. Setup Rust with clippy, rustfmt, and automatic dependency caching
      - name: 🛠️ Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy

      # 3. Verify Cargo.lock is synced with Cargo.toml (equivalent to --frozen-lockfile)
      - name: 📦 Verify Dependencies
        run: cargo fetch --locked

      # 4. Build Artifact
      - name: ⚙️ Build Artifact
        run: cargo build --release --workspace

      # 5. Test Code
      - name: ✅ Test Code
        run: cargo test --workspace

      - name: Validate release note extraction
        run: |
          python3 scripts/test_release_notes.py
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rune-kit-cli") | .version')
          python3 scripts/release_notes.py "$VERSION"

      - name: Installer smoke tests
        run: python3 scripts/test_installers.py --binary target/release/rune-kit

      # 6. Lint Code (Clippy)
      - name: 🧹 Lint Code
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 7. Format Code
      - name: 🧼 Format Code
        run: cargo fmt --all --check
