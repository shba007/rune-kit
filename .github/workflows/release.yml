name: Rune Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🔎 Read Workspace Version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rune-kit-cli") | .version')
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag does not match workspace version" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: python3 scripts/release_notes.py "${{ steps.version.outputs.version }}" --output release-notes.md

      # Uses a PAT rather than the default GITHUB_TOKEN: a release created
      # with the default token does not trigger other workflows' `on: release:
      # published` events (GitHub's own loop-prevention), which would silently
      # stop deploy.yml from ever running.
      - name: 📝 Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --verify-tag \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md
