name: Rune Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify owner-promoted release matches prepared history and notes
        run: |
          test -n "$GH_TOKEN" || { echo 'GH_TOKEN is required to publish a release that triggers artifact publication.' >&2; exit 1; }
          mkdir -p target
          VERSION=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rune-kit-cli") | .version')
          SUBJECT=$(git log -1 --format=%s)
          test "$SUBJECT" = "ci(release): publish v$VERSION" || { echo "Main promotion must use merge title ci(release): publish v$VERSION" >&2; exit 1; }
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 || { echo 'Promote develop using a merge commit, not squash/rebase.' >&2; exit 1; }
          cargo xtask release-check > target/release-check.json
          VERSION=$(jq -r .version target/release-check.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cargo xtask release-notes "$VERSION" --output target/release-notes.md
      - name: Publish matching tag and release using the prepared notes
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving its notes and assets unchanged."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "v$VERSION" --notes-file target/release-notes.md
          fi
      # GH_TOKEN is intentionally used above: PAT/App release events trigger
      # deploy.yml's release:published workflow; the default token does not.
