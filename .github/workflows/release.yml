name: Rune Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify owner-promoted release matches prepared history and notes
        run: |
          mkdir -p target
          cargo xtask release-check > target/release-check.json
          VERSION=$(jq -r .version target/release-check.json)
          READY=$(jq -r .ready target/release-check.json)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_READY=$READY" >> "$GITHUB_ENV"
          if [ "$READY" = true ]; then
            cargo xtask release-notes "$VERSION" --publication --output target/release-notes.md
          else
            jq -r .reason target/release-check.json
          fi
      - name: Check for an existing publication without publishing credentials
        if: env.RELEASE_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > target/existing-release.json 2> target/release-lookup-error.txt; then
            jq '{release: .}' target/existing-release.json > target/existing-release-event.json
            GITHUB_EVENT_PATH=target/existing-release-event.json cargo xtask release-artifact-check
            echo 'RELEASE_READY=false' >> "$GITHUB_ENV"
            echo "Release v$VERSION is already published; validated no-op."
          elif ! grep -q 'HTTP 404' target/release-lookup-error.txt; then
            cat target/release-lookup-error.txt >&2
            exit 1
          fi
      - name: Publish matching tag and release using the prepared notes
        if: env.RELEASE_READY == 'true'
        run: |
          test -n "$GH_TOKEN" || { echo 'GH_TOKEN is required for release/artifact events.' >&2; exit 1; }
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving its notes and assets unchanged."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "v$VERSION" --notes-file target/release-notes.md
          fi
      # GH_TOKEN is intentionally used above: PAT/App release events trigger
      # deploy.yml's release:published workflow; the default token does not.
