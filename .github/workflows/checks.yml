name: Rust checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cocogitto@7.0.0
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
        env:
          RUNE_KIT_DATA_DIR: ${{ runner.temp }}/rune-kit-checks
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check
      - name: Validate current changelog section
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rune-kit-cli") | .version')
          cargo xtask release-notes "$VERSION"
      - name: Validate the release preparation PR
        if: github.event_name == 'pull_request' && github.head_ref == 'release/update-version'
        run: cargo xtask release-check
