[package]
name = "rune-kit-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
extism.workspace = true
sha2.workspace = true
reqwest.workspace = true
dirs.workspace = true
thiserror.workspace = true
async-trait.workspace = true
base64 = "0.22"
flate2.workspace = true
tar.workspace = true
zip.workspace = true

jsonschema = { version = "0.60", default-features = false }

[dev-dependencies]
wat = "1"
tempfile = "3"

[features]
native-isolation-validation = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Com"] }
