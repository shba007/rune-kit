[package]
name = "rune-kit-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rune-kit"
path = "src/main.rs"

[lib]
name = "rune_kit_cli"
path = "src/lib.rs"

[dependencies]
rune-kit-core = { path = "../core" }
tokio.workspace = true
serde_json.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
ratatui = "0.30.2"
crossterm = "0.29"

[dev-dependencies]
xtask = { path = "../../xtask" }
tempfile = "3"
portable-pty = "0.9"
flate2.workspace = true
tar.workspace = true
zip.workspace = true
sha2.workspace = true

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]
