from_latest_tag = true
ignore_merge_commits = true
tag_prefix = "v"

# Release preparation uses Rust git-conventional/semver from main tags.
# GitHub Actions owns its preparation commit/PR; do not run mutating cog bump.

[commit_types]
feat = { changelog_title = "🚀 Features" }
fix = { changelog_title = "🐛 Bug Fixes" }
perf = { changelog_title = "⚡ Performance", bump_patch = true }
refactor = { changelog_title = "🚜 Refactoring" }
docs = { changelog_title = "📚 Documentation" }
style = { changelog_title = "🎨 Style" }
test = { changelog_title = "🧪 Testing" }
ci = { changelog_title = "🤖 Continuous Integration", omit_from_changelog = true }
chore = { changelog_title = "⚙️ Miscellaneous", omit_from_changelog = true }

[git_hooks.commit-msg]
script = "cog verify --file $1"

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "rune-kit"
owner = "shba007"
